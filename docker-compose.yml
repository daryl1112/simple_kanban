# DevBoard: three services — Postgres, the FastAPI backend, and the Next.js
# frontend. Per project convention, no service sets `container_name`, so Docker
# assigns names automatically (e.g. devboard-backend-1).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devboard}
      POSTGRES_DB: ${POSTGRES_DB:-devboard}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # Compose waits for this before starting the backend.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devboard}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-devboard}:${POSTGRES_PASSWORD:-devboard}@db:5432/${POSTGRES_DB:-devboard}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time; must be reachable from the
        # browser, hence localhost rather than the internal service name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
